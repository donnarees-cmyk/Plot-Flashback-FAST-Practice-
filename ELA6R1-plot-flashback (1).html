<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELA.6.R.1 Plot Development and Flashback - FAST Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172554;--bg:#eaf1fb;--line:#c9d6ea;--teal:#0d9488;--sun:#facc15}
*{box-sizing:border-box}body{margin:0;font-family:Lexend,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 40px}
header{background:var(--ink);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}
header h1{margin:0 0 4px;font-size:clamp(1.3rem,4vw,1.9rem)}header p{margin:0;opacity:.85;font-size:.9rem}
main{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
details{background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}summary{cursor:pointer;font-weight:700}
ol{padding-left:22px}li{margin:4px 0}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.pass{background:#fffbea;border:1px solid #f3e3a1;border-left:6px solid var(--sun);border-radius:8px;padding:14px 16px;margin:10px 0}
.pass h4{margin:0 0 8px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;margin-top:10px}
.meta{font-size:.85rem;opacity:.7;margin:12px 0 0}.opts{display:grid;gap:8px;margin:8px 0 14px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:11px}
.opt:hover:not(:disabled){border-color:var(--teal)}.opt.sel{border-color:var(--ink);background:#e0e7ff}
.opt.ok{background:#dcfce7;border-color:#16a34a}.opt.no{background:#fee2e2;border-color:#dc2626}
.fb{border-radius:8px;padding:10px;margin:8px 0}.fb.ok{background:#dcfce7}.fb.no{background:#fef9c3}.done{text-align:center}
</style></head><body><div class="wrap">
<header><h1>Plot Development and Flashback</h1><p>ELA.6.R.1: Reading Prose and Poetry: Literary Elements.<br>Tier 1 FAST-style practice</p></header>
<main aria-live="polite"><details><summary>Strategy reminder</summary><p id="goal"></p><ol id="steps"></ol></details>
<div class="pass" id="pass"></div><div id="prac"></div></main></div>
<script>
/* ===== EDIT CONTENT HERE: goal, steps, p (passage), qs. Each question has parts: q, o (choices), a (answer text, or a list for Select TWO) ===== */
const L={"goal": "Explain how plot events and flashbacks develop a character and a story.", "steps": ["Map the plot: exposition, rising action, climax, falling action, resolution.", "Find clue words for a flashback, such as \"years ago\" and \"had\".", "Ask why the author included the earlier scene."], "p": "<h4>\"The Sign-Up Sheet\"</h4>Marcus stared at the blank sign-up sheet for the school talent show. His pen hovered above the paper.<br><br>Three years ago, at his cousin's wedding, Marcus had stepped up to the microphone to sing. His voice cracked on the first note, and a ripple of giggles spread across the room. He had never sung in public since.<br><br>Now his best friend, Eli, leaned over his shoulder. \"You have the best voice in our grade,\" Eli whispered. \"Just try.\"<br><br>Marcus's heart thudded. He pressed the pen down and wrote his name in careful, shaky letters. Then, before he could change his mind, he handed the sheet to the teacher.<br><br>On the night of the show, he walked onto the stage and sang. His voice did not crack. When the applause came, Marcus finally smiled.", "qs": [{"e": "It jumps back to an earlier time.", "parts": [{"q": "Which sentence begins the flashback?", "a": "Three years ago, at his cousin's wedding, Marcus had stepped up to the microphone to sing.", "o": ["Three years ago, at his cousin's wedding, Marcus had stepped up to the microphone to sing.", "Marcus stared at the blank sign-up sheet.", "Now his best friend, Eli, leaned over his shoulder.", "On the night of the show, he walked onto the stage."]}]}, {"e": "The embarrassing memory explains his fear.", "parts": [{"q": "Why does the author include the flashback?", "a": "To explain why Marcus is afraid to sign up", "o": ["To explain why Marcus is afraid to sign up", "To introduce a new setting for the story", "To show that Eli is a bad friend", "To describe the talent show rules"]}, {"q": "Which detail best supports your answer to Part A?", "a": "His voice cracked on the first note, and a ripple of giggles spread across the room.", "o": ["His voice cracked on the first note, and a ripple of giggles spread across the room.", "Marcus stared at the blank sign-up sheet.", "\"Just try.\"", "He handed the sheet to the teacher."]}]}, {"e": "The resolution shows how the problem ends.", "parts": [{"q": "Which event is part of the resolution?", "a": "Marcus smiles when the audience applauds", "o": ["Marcus smiles when the audience applauds", "Marcus stares at the blank sheet", "Eli whispers to Marcus", "Marcus's voice cracks at the wedding"]}]}, {"e": "A time phrase and past-perfect verbs signal an earlier event.", "parts": [{"q": "Which TWO clues show that the flashback is happening?", "a": ["Three years ago", "had stepped up to the microphone"], "o": ["Three years ago", "had stepped up to the microphone", "Now his best friend", "leaned over his shoulder", "On the night of the show"]}]}, {"e": "Eli's words are the turning point in the rising action.", "parts": [{"q": "How does Eli move the plot forward?", "a": "His encouragement pushes Marcus to sign up", "o": ["His encouragement pushes Marcus to sign up", "He signs up for Marcus", "He tells the teacher about the wedding", "He sings at the talent show"]}]}, {"e": "Singing without his voice cracking shows he overcame his fear.", "parts": [{"q": "Which statement best describes how Marcus changes?", "a": "He changes from afraid of performing to confident", "o": ["He changes from afraid of performing to confident", "He changes from shy to angry", "He stays afraid of singing", "He changes from confident to nervous"]}, {"q": "Which detail best shows this change?", "a": "His voice did not crack.", "o": ["His voice did not crack.", "Marcus stared at the blank sign-up sheet.", "He had never sung in public since.", "Marcus's heart thudded."]}]}]};
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const Q=L.qs;let score=0,missed=[];
$('goal').textContent=L.goal;$('steps').innerHTML=L.steps.map(s=>'<li>'+s+'</li>').join('');$('pass').innerHTML=L.p;
function show(i){
  const it=Q[i],multi=p=>Array.isArray(p.a);let locked=false;
  it.parts.forEach(p=>p.s=shuffle(p.o));const sel=it.parts.map(()=>new Set());
  $('prac').innerHTML='<p class="meta">Question '+(i+1)+' of '+Q.length+'</p>'+(it.c?'<div class="pass">'+it.c+'</div>':'')+
   it.parts.map((p,k)=>'<p><b>'+(it.parts.length>1?'Part '+'AB'[k]+': ':'')+p.q+'</b>'+(multi(p)?' <i>(Select TWO.)</i>':'')+'</p><div class="opts" data-k="'+k+'">'+p.s.map((o,j)=>'<button class="opt" data-j="'+j+'">'+o+'</button>').join('')+'</div>').join('')+'<div id="fb"></div><button class="btn" id="go">Submit answer</button>';
  document.querySelectorAll('.opts').forEach(g=>{const k=+g.dataset.k,p=it.parts[k],s=sel[k];
    g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;const j=+b.dataset.j;
      if(multi(p)){s.has(j)?s.delete(j):(s.size<2&&s.add(j))}else{s.clear();s.add(j)}
      g.querySelectorAll('.opt').forEach((x,m)=>x.classList.toggle('sel',s.has(m)))})});
  $('go').onclick=()=>{
    if(locked){if(i+1<Q.length)show(i+1);else end();return}
    if(it.parts.some((p,k)=>sel[k].size!==(multi(p)?2:1))){$('fb').innerHTML='<div class="fb no">Answer every part before you submit.</div>';return}
    locked=true;let all=true;
    it.parts.forEach((p,k)=>{const ans=multi(p)?p.a:[p.a];
      const picked=[...sel[k]].map(j=>p.s[j]);if(!(picked.length===ans.length&&picked.every(x=>ans.includes(x))))all=false;
      document.querySelectorAll('.opts')[k].querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;b.classList.remove('sel');
        if(ans.includes(p.s[j]))b.classList.add('ok');else if(sel[k].has(j))b.classList.add('no')})});
    if(all)score++;else missed.push(i+1);
    $('fb').innerHTML='<div class="fb '+(all?'ok':'no')+'">'+(all?'✓ Correct! ':'✗ Not quite. ')+it.e+'</div>';
    $('go').textContent=i+1<Q.length?'Next question':'See my results';
  };
}
function end(){$('prac').innerHTML='<div class="done"><h3>Practice complete</h3><p><b>'+score+' of '+Q.length+'</b> correct.</p><p>'+(missed.length?'Review question'+(missed.length>1?'s ':' ')+missed.join(', ')+' and look back at the passage for evidence.':'You got every question right!')+'</p><button class="btn" id="rt">Try again</button></div>';
  $('rt').onclick=()=>{score=0;missed=[];show(0)}}
show(0);
</script></body></html>
